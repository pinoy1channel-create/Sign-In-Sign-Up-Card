<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic Flipping Home Page</title>
  <style>
    /* Base setup - The entire screen is clickable to flip */
    body {
      background-color: #020d0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: pointer;
      perspective: 1200px; /* Crucial for 3D physics */
      user-select: none;
    }

    /* THE 3D FLIP CONTAINER */
    .flip-card-container {
      width: 100%;
      max-width: 400px;
      height: 480px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Triggered by the global background click listener */
    .flip-card-container.is-flipped {
      transform: rotateY(180deg);
    }

    /* SHARED SIDE PROPERTIES */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-color: #b4b5ae;
      padding: 40px;
      border-radius: 30px;
      box-sizing: border-box;
      backface-visibility: hidden; /* Hides the reverse side when facing away */
      box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* BACK SIDE SETUP (Create Account) */
    .card-back {
      transform: rotateY(180deg);
    }

    /* EMBOSSED DESIGN STYLES */
    h2 {
      color: #4d5d75;
      margin-bottom: 20px;
      font-size: 24px;
      text-align: center;
    }

    .embossed-input {
      width: 100%;
      padding: 15px 20px;
      margin: 10px 0;
      border: none;
      outline: none;
      border-radius: 20px;
      background-color: #e0e8f6;
      color: #4d5d75;
      font-size: 16px;
      box-sizing: border-box;
      box-shadow: inset 4px 4px 6px #cbd5e1, inset -4px -4px 6px #ffffff;
      cursor: text;
    }

    /* REALISTIC BRANDING BUTTON */
    .btn-submit {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 20px;
      background: #ed9209;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 8px #cbd5e1, -4px -4px 8px #ffffff;
    }

    .hint-text {
      display: block;
      margin-top: 25px;
      color: #6b7c96;
      font-size: 13px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 3D Wrapper Layer -->
  <div class="flip-card-container" id="securityCard">
    
    <!-- SIDE 1: FRONT (Secure Log In) -->
    <div class="card-front">
      <h2>Sign In</h2>
      <form onsubmit="event.preventDefault();">
        <input type="text" class="embossed-input" placeholder="Username" required onclick="event.stopPropagation();">
        <input type="password" class="embossed-input" placeholder="Password" required onclick="event.stopPropagation();">
        <button type="submit" class="btn-submit" onclick="event.stopPropagation();" style="background-color: #0bb552;">Submit</button>
        <br>
        <br>
        <a href="https://github.com/user-attachments/assets/f52b6811-cf4e-4aac-b02a-f631e59bbb9b"><small>Forgot Password?</small></a>
      </form>
      <span class="hint-text"></span>
    </div>

    <!-- SIDE 2: BACK (Create Account) -->
    <div class="card-back">
      <h2>Sign Up</h2>
      <form onsubmit="event.preventDefault();">
        <input type="text" class="embossed-input" placeholder="Full Name" required onclick="event.stopPropagation();">
        <input type="email" class="embossed-input" placeholder="Email Address" required onclick="event.stopPropagation();">
        <input type="password" class="embossed-input" placeholder="Choose Password" required onclick="event.stopPropagation();">
        <input type="password" class="embossed-input" placeholder="Re-type Password" required onclick="event.stopPropagation();">
        <button type="submit" class="btn-submit" onclick="event.stopPropagation();" style="background: #e6a10e;">Create an account</button>
        <br>
        <br>
        <a href="https://github.com/user-attachments/assets/f52b6811-cf4e-4aac-b02a-f631e59bbb9b"><small>Has already an account?</small>&ensp;<strong>Sign in</strong></a>

      </form>
      <span class="hint-text"></span>
    </div>

  </div>

  <script>
    // Global click listener that triggers whenever background space is clicked
    document.body.addEventListener('click', function() {
      const card = document.getElementById('securityCard');
      card.classList.toggle('is-flipped');
    });
  </script>

</body>
</html>
